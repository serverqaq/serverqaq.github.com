  <!-- ── Page Header ── -->
  <div class="page-header">
    <div class="container">
      <p class="section-subtitle">联系我们</p>
      <h1>联系</h1>
    </div>
  </div>

  <!-- ── Contact section ── -->
  <section class="section">
    <div class="container">
      <div class="contact-grid">

        <!-- Left: Contact info -->
        <div class="contact-info-list fade-up">

          <div>
            <p class="contact-label">邮箱</p>
            <p class="contact-value">
              <a href="mailto:ewenwangye@gmail.com">ewenwangye@gmail.com</a>
            </p>
          </div>

          <div>
            <p class="contact-label">电话</p>
            <p class="contact-value">
              <a href="tel:+8615811318196">+86 158 1131 8196</a>
            </p>
          </div>

          <div>
            <p class="contact-label">工作室</p>
            <p class="contact-value">
              <a href="https://j.map.baidu.com/df/fXJJ" target="_blank" rel="noopener">京中书画院</a>
            </p>
          </div>

          <div>
            <p class="contact-label">咨询事项</p>
            <p class="contact-value" style="font-size:.9rem; color:var(--muted);">作品询价、展览合作、媒体采访或版权授权，可通过右侧表单或直接邮件联系。</p>
          </div>

        </div>

        <!-- Right: Enquiry form -->
        <div class="fade-up">
          <p class="contact-label" style="margin-bottom:.8rem;">在线咨询</p>

          <div id="form-success" class="form-success" hidden>已收到您的留言，我们会尽快通过邮件回复。</div>

          <!-- Shown only while the form has no working endpoint. -->
          <p id="form-fallback" class="contact-value" hidden style="font-size:.92rem; color:var(--muted);">
            <span>咨询请发送至</span>
            <a href="mailto:ewenwangye@gmail.com">ewenwangye@gmail.com</a>
          </p>

          <form class="enquiry-form" action="https://formspree.io/f/REPLACE_WITH_FORM_ID" method="POST">
            <input type="hidden" name="_next" value="https://www.wdanyi.com/contact.html?sent=1">
            <input type="hidden" name="_subject" value="Website enquiry — wdanyi.com">
            <!-- honeypot -->
            <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">

            <div class="field">
              <label for="f-name">姓名</label>
              <input id="f-name" name="name" type="text" required autocomplete="name">
            </div>

            <div class="field">
              <label for="f-email">邮箱</label>
              <input id="f-email" name="email" type="email" required autocomplete="email">
            </div>

            <div class="field">
              <label for="f-topic">咨询类型</label>
              <select id="f-topic" name="topic">
                <option value="Work enquiry">作品咨询</option>
                <option value="Exhibition">展览与画廊合作</option>
                <option value="Press">媒体采访</option>
                <option value="Other">其他</option>
              </select>
            </div>

            <div class="field">
              <label for="f-message">留言</label>
              <textarea id="f-message" name="message" rows="5" required></textarea>
            </div>

            <button type="submit" class="btn-submit">发送</button>
          </form>
        </div>

      </div>
    </div>
  </section>
